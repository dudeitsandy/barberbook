version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Constructing DATABASE_URL..."
        - export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"
        - echo "DATABASE_URL: $DATABASE_URL"
        - npm ci
    build:
      commands:
        - npm run build
artifacts:
  baseDirectory: .next
  files:
    - '**/*'
    - public/**/*
cache:
  paths:
    - node_modules/**/*
